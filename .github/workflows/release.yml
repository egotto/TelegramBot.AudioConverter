name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Detect created tag
        id: tag
        shell: bash
        run: |
          TAG=$(git tag --points-at HEAD | sort -V | tail -n 1)
          if [ -z "$TAG" ]; then
            echo "No tag on HEAD"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: |
            ghcr.io/egotto/telegrambot.audioconverter:${{ steps.tag.outputs.version }}
            ghcr.io/egotto/telegrambot.audioconverter:latest

      - name: Update release with image info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ steps.tag.outputs.tag }}" \
            --notes "$(gh release view "${{ steps.tag.outputs.tag }}" --json body --jq .body) Docker image: ghcr.io/egotto/telegrambot.audioconverter:${{ steps.tag.outputs.version }}"
